[project]
name = "foundtion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tomzine", email = "mohamedtomzine60@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.162.5",
    "pwdlib[argon2]>=0.4.2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
foundtion = "foundtion:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
